<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <!-- Language switch: one button per language. data-lang must match a key in I18N (content.js) -->
  <div class="topbar lang" id="lang" role="group" aria-label="Language">
    <button data-lang="pt" aria-pressed="false" aria-label="Português" title="Português">
      <svg viewBox="0 0 30 20" aria-hidden="true">
        <rect width="30" height="20" fill="#ff0000"/>
        <rect width="12" height="20" fill="#006600"/>
        <circle cx="12" cy="10" r="3.8" fill="#ffcc00"/>
        <path d="M9.9 7.9h4.2v2.8c0 1.3-1 2.1-2.1 2.6c-1.1-.5-2.1-1.3-2.1-2.6z" fill="#ff0000" stroke="#fff" stroke-width=".5"/>
      </svg>
    </button>
    <button data-lang="en" aria-pressed="false" aria-label="English" title="English">
      <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
        <clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
        <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
        <g clip-path="url(#uk-s)">
          <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#c8102e" stroke-width="4"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
        </g>
      </svg>
    </button>
    <button data-lang="de" aria-pressed="false" aria-label="Deutsch" title="Deutsch">
      <svg viewBox="0 0 30 20" aria-hidden="true">
        <rect width="30" height="6.67" fill="#000"/>
        <rect y="6.67" width="30" height="6.67" fill="#dd0000"/>
        <rect y="13.33" width="30" height="6.67" fill="#ffce00"/>
      </svg>
    </button>
  </div>

  <!-- Empty boxes: app.js fills them in -->
  <header class="hero">
    <!-- Pictures: left = friends/characters, right = me (list in content.js, HERO) -->
    <div class="hero-side hero-left" id="heroLeft"></div>
    <div class="hero-center">
      <p class="big">30</p>
      <h1 id="heroTitle"></h1>
      <p class="date" id="heroDate"></p>
      <span class="countdown" id="countdown"></span>
    </div>
    <div class="hero-side hero-right" id="heroRight"></div>
  </header>

  <!-- Important notice (text in content.js, I18N "notice"; empty = hidden) -->
  <p class="notice" id="notice" hidden></p>

  <div class="section-head">
    <h2 id="weekTitle"></h2>
  </div>

  <div class="days-wrap">
    <button class="days-nav prev" id="daysPrev" aria-label="Previous days" hidden>&#8249;</button>
    <div class="days" id="days"></div>
    <button class="days-nav next" id="daysNext" aria-label="Next days">&#8250;</button>
  </div>
  <p class="scroll-hint" id="scrollHint"></p>
  <!-- The slot keeps a fixed height, so opening or closing a panel never moves the page -->
  <div class="panel-slot">
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>
  <p class="hint" id="hint"></p>

  <!-- Confirmed guests (list in content.js, GUESTS) -->
  <section class="guests" aria-labelledby="guestsTitle">
    <h2 id="guestsTitle"></h2>
    <p class="guests-intro" id="guestsIntro"></p>
    <ul class="guest-list" id="guestList"></ul>
  </section>

  <footer id="footer"></footer>
</div>

<!-- Order matters: content first, then the logic that uses it -->
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
